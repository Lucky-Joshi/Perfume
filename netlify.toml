[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[dev]
  command = "npm run dev"
  port = 3000
  targetPort = 5000
  framework = "#custom"

[[redirects]]
  from = "/api/*"
  to = "http://localhost:5000/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "http://localhost:5000/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
