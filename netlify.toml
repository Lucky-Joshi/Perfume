[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "24.7.0"

# Proxy API + uploads to the deployed backend so the SPA can use same-origin
# relative URLs (baseURL "/api").
[[redirects]]
  from = "/api/*"
  to = "https://perfume-mx9m.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://perfume-mx9m.onrender.com/uploads/:splat"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
