services:
  - type: web
    name: essence-aura-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 24.7.0
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://essence-aura.netlify.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: ADMIN_EMAIL
        value: admin@essenceaura.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        value: "Essence Aura <no-reply@essenceaura.com>"

staticSites:
  - name: essence-aura-frontend
    rootDir: frontend
    buildCommand: npm run build
    publishDir: dist
    buildFilter:
      paths:
        - frontend/**
    redirects:
      - source: "/*"
        destination: "/index.html"
        status: 200
