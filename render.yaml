services:
  - type: web
    name: essence-aura-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 24.7.0
      - key: NODE_ENV
        value: production
      - key: PORT
        fromService:
          type: web
          name: essence-aura-api
          property: port
      - key: CLIENT_URL
        value: https://essence-aura.netlify.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@essenceaura.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: MAILTRAP_HOST
        sync: false
      - key: MAILTRAP_USER
        sync: false
      - key: MAILTRAP_PASS
        sync: false

staticSites:
  - name: essence-aura-frontend
    rootDir: frontend
    buildCommand: npm run build
    publishDir: dist
    buildFilter:
      paths:
        - frontend/**
    envVars:
      - key: VITE_API_URL
        value: https://essence-aura-api.onrender.com/api
      - key: VITE_UPLOADS_URL
        value: https://essence-aura-api.onrender.com/uploads
    redirects:
      - source: "/*"
        destination: "/index.html"
        status: 200
EOF